<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="bubble">
      <path d="M256 40 C 130 40, 40 130, 40 256 C 40 318, 65 370, 105 410 L 75 480 L 160 455 C 190 465, 222 472, 256 472 C 382 472, 472 382, 472 256 C 472 130, 382 40, 256 40 Z" />
    </clipPath>
  </defs>

  <!-- Outer background circle / dark green whatsapp border -->
  <circle cx="256" cy="256" r="256" fill="#075e54" />

  <!-- Inner WhatsApp bubble with Indian Tiranga Flag -->
  <g clipPath="url(#bubble)">
    <!-- Saffron Band -->
    <rect x="0" y="0" width="512" height="184" fill="#FF9933" />
    <!-- White Middle Band -->
    <rect x="0" y="184" width="512" height="144" fill="#FFFFFF" />
    <!-- Green Bottom Band -->
    <rect x="0" y="328" width="512" height="184" fill="#138808" />

    <!-- Ashoka Chakra (Navy Blue #000080) in center -->
    <g transform="translate(256, 256)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#000080" stroke-width="6" />
      <circle cx="0" cy="0" r="12" fill="#000080" />
      <!-- 24 Spokes -->
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(15)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(30)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(45)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(60)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(75)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(90)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(105)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(120)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(135)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(150)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(165)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(180)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(195)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(210)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(225)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(240)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(255)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(270)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(285)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(300)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(315)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(330)" />
      <line x1="0" y1="0" x2="0" y2="-54" stroke="#000080" stroke-width="4" transform="rotate(345)" />
    </g>
  </g>

  <!-- Gold/Emerald E2EE Lock Emblem Badge -->
  <g transform="translate(340, 340)">
    <circle cx="60" cy="60" r="54" fill="#111b21" stroke="#00a884" stroke-width="8" />
    <path d="M44 56 v-16 a16 16 0 0 1 32 0 v16 m-22 0 h44 a6 6 0 0 1 6 6 v22 a6 6 0 0 1 -6 6 h-44 a6 6 0 0 1 -6 -6 v-22 a6 6 0 0 1 6 -6" stroke="#25d366" stroke-width="7" fill="none" stroke-linecap="round" />
  </g>
</svg>
